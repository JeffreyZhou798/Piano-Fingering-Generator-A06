# GitHub Actions - 自动部署到Vercel
# 注意：这个文件仅用于验证配置，实际部署通过Vercel Dashboard完成

name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 构建测试任务
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 安装依赖
      run: |
        cd frontend
        npm ci
    
    - name: 代码检查
      run: |
        cd frontend
        npm run lint
    
    - name: 构建项目
      run: |
        cd frontend
        npm run build
    
    - name: 检查构建输出
      run: |
        cd frontend
        ls -la out/
        echo "Build completed successfully!"

  # 部署验证（不实际部署）
  verify-deployment:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: 验证部署配置
      run: |
        echo "✅ 构建成功"
        echo "✅ 部署配置已验证"
        echo "📝 实际部署请通过Vercel Dashboard进行"
